name: Publish Sphinx showcase to gh-pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  publish-showcase:
    name: Build and publish Sphinx showcase
    runs-on: ubuntu-latest

    steps:
      - name: Check out Sphinx repository
        uses: actions/checkout@v4
        with:
          path: sphinx
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install showcase dependencies
        working-directory: sphinx
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade '.[sphinx]'
          python -m pip install --upgrade furo

      - name: Build supported showcase themes
        working-directory: sphinx/test
        run: |
          make clean-furo html-furo
          make clean-alabaster html-alabaster
          make clean-classic html-classic

      - name: Prepare gh-pages worktree
        working-directory: sphinx
        run: |
          git fetch origin +gh-pages:gh-pages || true
          rm -rf ../gh-pages
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git worktree add ../gh-pages gh-pages
          else
            git worktree add --detach ../gh-pages HEAD
            git -C ../gh-pages checkout --orphan gh-pages
            git -C ../gh-pages rm -rf .
          fi

      - name: Update gh-pages showcase directories
        run: |
          rm -rf gh-pages/sphinx/furo gh-pages/sphinx/alabaster gh-pages/sphinx/classic
          mkdir -p gh-pages/sphinx
          touch gh-pages/.nojekyll
          cp -a sphinx/test/build-furo/html gh-pages/sphinx/furo
          cp -a sphinx/test/build-alabaster/html gh-pages/sphinx/alabaster
          cp -a sphinx/test/build-classic/html gh-pages/sphinx/classic

      - name: Commit and push gh-pages update
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll sphinx/furo sphinx/alabaster sphinx/classic
          if git diff --cached --quiet; then
            echo "No Sphinx showcase changes to publish."
            exit 0
          fi
          git commit -m "Publish Sphinx showcase"
          git push origin HEAD:gh-pages
