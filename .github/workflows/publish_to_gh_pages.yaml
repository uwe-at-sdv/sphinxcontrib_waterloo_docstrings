name: Publish Sphinx documentation to gh-pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  publish-docs:
    name: Build and publish Sphinx documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out Sphinx repository
        uses: actions/checkout@v4
        with:
          path: sphinx
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install documentation dependencies
        working-directory: sphinx
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade '.[sphinx]'
          python -m pip install --upgrade furo python-waterloo-lexer

      - name: Build project documentation
        working-directory: sphinx/doc
        run: make clean html

      - name: Build supported showcase themes
        working-directory: sphinx/test
        run: |
          make clean-furo html-furo
          make clean-alabaster html-alabaster
          make clean-classic html-classic

      - name: Prepare gh-pages worktree
        working-directory: sphinx
        run: |
          git fetch origin +gh-pages:gh-pages || true
          rm -rf ../gh-pages
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git worktree add ../gh-pages gh-pages
          else
            git worktree add --detach ../gh-pages HEAD
            git -C ../gh-pages checkout --orphan gh-pages
            git -C ../gh-pages rm -rf .
          fi

      - name: Update gh-pages documentation
        run: |
          find gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          touch gh-pages/.nojekyll
          cp -a sphinx/doc/build/html/. gh-pages/
          mkdir -p gh-pages/showcase
          cp -a sphinx/test/build-furo/html gh-pages/showcase/furo
          cp -a sphinx/test/build-alabaster/html gh-pages/showcase/alabaster
          cp -a sphinx/test/build-classic/html gh-pages/showcase/classic
          mkdir -p gh-pages/doc-json
          mkdir -p gh-pages/doc-html5
          cp -a sphinx/doc/doc-json/wtrl-sphinx.wtrl.core.rfc-2119.json gh-pages/doc-json
          cp -a sphinx/doc/doc-html5/wtrl-sphinx.wtrl.core.rfc-2119.html gh-pages/doc-html5

      - name: Commit and push gh-pages update
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "No Sphinx documentation changes to publish."
            exit 0
          fi
          git commit -m "Publish Sphinx documentation"
          git push origin HEAD:gh-pages
